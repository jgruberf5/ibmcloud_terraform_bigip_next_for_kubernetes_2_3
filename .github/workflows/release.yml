name: Release

# On `release: published`:
#   1. Build the runner image and push it to ghcr.io tagged with both
#      the release tag and `latest`.
#   2. Once the image is published, rewrite the install URL in
#      README.md so the curl one-liner pins to the new tag.
#
# workflow_dispatch is provided for re-running by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and pin install URL to (e.g. v2.3.0)"
        required: true

permissions:
  contents: write     # bump-install-url commits to main
  packages: write     # build-and-push uploads to ghcr.io

env:
  IMAGE_NAME: ibmcloud-terraform-bnk-2-3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag:   ${{ steps.tag.outputs.value }}
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      # Lowercase the owner so ghcr.io's path requirements are met
      # (some org/user logins contain capitals; ghcr image paths must
      # be all lowercase).
      - name: Lowercase owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ghcr.io/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ needs.build-and-push.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.tag }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull just-published image
        run: docker pull "$IMAGE"

      - name: bnk help renders
        run: docker run --rm "$IMAGE" bnk help | grep -q "bnk init"

      - name: bnk completion bash generates
        run: docker run --rm "$IMAGE" bnk completion bash | grep -q _bnk_complete

      - name: every expected CLI is present in PATH
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            for c in terraform kubectl oc helm jq ibmcloud python3 awk grep cloud-exec bnk; do
              command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }
              echo "  ok: $c"
            done
          '

      - name: terraform validate against the in-image project
        run: |
          docker run --rm --entrypoint "" "$IMAGE" \
            sh -c 'TF_DATA_DIR=/opt/tf-project/.terraform terraform -chdir=/opt/tf-project validate -no-color'

      - name: bnk doctor with stub tfvars fails at IBM Cloud login (expected)
        run: |
          set +e
          mkdir -p /tmp/smoke
          cat > /tmp/smoke/terraform.tfvars <<'TFVARS'
          ibmcloud_api_key = "STUB-INVALID-KEY-FOR-CI"
          ibmcloud_cluster_region = "ca-tor"
          TFVARS
          docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v /tmp/smoke:/work \
              "$IMAGE" bnk doctor 2>&1 | tee /tmp/doctor.log
          rc=${PIPESTATUS[0]}
          # We expect doctor to exit non-zero (login probe should fail
          # against the stub key). Any other outcome is a regression.
          if (( rc == 0 )); then
            echo "::error::bnk doctor unexpectedly succeeded with a stub API key"
            exit 1
          fi
          grep -q "ibmcloud login failed" /tmp/doctor.log || {
            echo "::error::doctor should report 'ibmcloud login failed' on a stub key"
            exit 1
          }
          # And the host-side checks must have all passed before the probe
          grep -q "current directory writable" /tmp/doctor.log || {
            echo "::error::doctor's host-environment section regressed"
            exit 1
          }

      - name: airgap install path produces a working bnk
        run: |
          mkdir -p /tmp/airgap
          docker run --rm -v /tmp/airgap:/dest "$IMAGE" bnk install
          test -x /tmp/airgap/bnk
          /tmp/airgap/bnk help | grep -q "bnk init"

      - name: curl install path produces a working bnk
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          mkdir -p /tmp/curl-install
          # The release was just published, so /raw/<tag>/install.sh is live.
          # Pin BNK_VERSION so the script downloads the matching bnk
          # rather than re-querying the GitHub API for "latest".
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${TAG}/install.sh" \
              | INSTALL_DIR=/tmp/curl-install BNK_VERSION="${TAG}" bash
          test -x /tmp/curl-install/bnk
          /tmp/curl-install/bnk help | grep -q "bnk init"

  bump-install-url:
    needs: [build-and-push, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch README install URL
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -e
          if ! grep -q "<!-- BNK_INSTALL_URL_BEGIN -->" README.md; then
            echo "::error::install URL markers missing from README.md"
            exit 1
          fi
          sed -i -E "/<!-- BNK_INSTALL_URL_BEGIN -->/,/<!-- BNK_INSTALL_URL_END -->/ {
              s|(raw\\.githubusercontent\\.com/[^/]+/[^/]+/)[^/]+(/install\\.sh)|\\1${TAG}\\2|g
          }" README.md

      - name: Commit and push if changed
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if git diff --quiet README.md; then
            echo "README.md unchanged — install URL already at ${TAG}"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: bump install URL to ${TAG}"
          git push origin main
